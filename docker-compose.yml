# Local Postgres with pgvector. The backend runs on the host (see README / backend/).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
